<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="src/style.css" />
    <title>Crystals AI</title>
  </head>
  <body>
    <div class="container">
      <header>
        <h1>Crystals AI</h1>
      </header>
      <main>
        <form>
          <input
            type="text"
            id="userInput"
            placeholder="Type your Crystal here..."
            autofocus
            required
            autocomplete="off"
            class="input-field"
          />
          <input type="submit" class="submit-button" />
        </form>
        <div class="results">
          RESULTS HERE
          <br />
          <!-- This is a placeholder for the AI response. -->
        </div>
      </main>
      <footer>
        This AI Project was Coded by
        <a href="https://github.com/shiz2633" target="_blank">Sirin Kiani</a> on
        <a href="https://github.com/shiz2633/Crystals-AI" target="_blank"
          >GitHub</a
        >
        Hosted on
        <a href="https://crystals-ai.netlify.app" target="_blank">Netlify</a>
      </footer>
    </div>
    <script src="src/script.js"></script>
  </body>
</html>
